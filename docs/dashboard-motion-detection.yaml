# Motion Detection card for a Home Assistant dashboard (paste into a card's
# YAML editor). Top: live image, as the Wayzn app draws it (green enabled,
# grey disabled, orange = motion now). Bottom: tap a cell to toggle it.
# Entity IDs assume the device is named "Dog Door Direct" in the Living Room
# area; adjust the prefix if yours differs.
type: vertical-stack
cards:
  - type: picture-entity
    entity: image.living_room_dog_door_direct_motion_detection_area
    show_name: false
    show_state: false
  - type: grid
    columns: 4
    square: true
    cards:
      - type: tile
        entity: switch.living_room_dog_door_direct_detection_cell_row_1_col_1
        name: "1·1"
        vertical: true
        hide_state: true
        color: green
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle
